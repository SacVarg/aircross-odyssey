<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOYAGER | Mission Control</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body id="app-body">

    <div id="public-view" class="theme-public transition-all duration-300">
        <div id="loader"><div class="text-slate-800 font-space font-bold tracking-[0.3em] text-sm">INITIALIZING SYSTEMS</div><div class="loader-line"></div></div>
        
        <div class="blob-bg blob-1"></div><div class="blob-bg blob-2"></div><div class="blob-bg blob-3"></div>

        <nav class="fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center bg-white/50 backdrop-blur-xl border-b border-white/60 shadow-sm transition-all duration-300">
            <div class="font-space font-bold text-xl tracking-[0.2em] text-slate-800 flex items-center gap-2 cursor-pointer select-none" onclick="window.triggerHyperdrive()">
                <i data-lucide="compass" class="w-5 h-5 text-emerald-500 animate-pulse"></i> VOYAGER
            </div>
            <div class="flex gap-8 text-xs font-space font-bold tracking-widest text-slate-500 hidden md:flex">
                <a href="#mission" class="hover:text-emerald-500 transition-colors">MISSION</a>
                <a href="#machine" class="hover:text-violet-500 transition-colors">MACHINE</a>
                <a href="#route" class="hover:text-pink-500 transition-colors">ROUTE</a>
                <a href="#crew" class="hover:text-orange-500 transition-colors">CREW</a>
                <a href="#comms" class="hover:text-cyan-500 transition-colors">COMMS</a>
            </div>
            <a href="#admin" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-cyan-500 text-white text-xs font-space font-bold tracking-widest rounded-full hover:shadow-glow-cyan hover:scale-105 transition-all flex items-center gap-2">
                <i data-lucide="satellite" class="w-4 h-4"></i> ADMIN
            </a>
        </nav>

        <div id="event-banner" class="event-banner mx-4 mt-24 px-6 py-4 rounded-2xl relative z-40" style="display: none;"></div>
        
        <section id="mission" class="relative min-h-screen flex flex-col items-center justify-center pt-20 pb-10 overflow-hidden">
            <div id="hero-canvas-container"></div>
            <div class="shooting-star star-1"></div><div class="shooting-star star-2"></div><div class="shooting-star star-3"></div>
            <div class="satellite-drift"><i data-lucide="satellite" class="w-16 h-16 drop-shadow-[0_0_10px_rgba(16,185,129,0.5)]"></i></div>
            
            <div class="z-10 flex flex-col items-center text-center px-4 w-full max-w-6xl mt-12">
                <h1 class="text-6xl md:text-8xl lg:text-[140px] font-black font-space mb-2 tracking-tighter leading-none text-slate-900 cyber-title">AIRCROSS</h1>
                <h2 class="text-5xl md:text-7xl lg:text-8xl font-black font-space mb-8 tracking-tighter leading-none text-gradient uppercase drop-shadow-md">Odyssey</h2>
                <a href="#machine" class="group relative inline-flex px-10 py-5 bg-white overflow-hidden rounded-2xl border-2 border-emerald-300 transition-all hover:border-emerald-500 shadow-soft-color hover:shadow-[0_0_30px_rgba(16,185,129,0.5)]">
                    <span class="relative font-space font-bold tracking-[0.2em] text-slate-800 flex items-center gap-3 text-sm md:text-base group-hover:text-emerald-700 transition-colors">START THE JOURNEY <i data-lucide="arrow-down-circle" class="w-5 h-5"></i></span>
                </a>
            </div>
        </section>

        <section id="countdown-section" class="py-24 relative px-4 z-10">...</section>
        <section id="machine" class="py-32 px-4 relative z-10">...</section>
        <section id="route" class="py-32 px-4 relative z-10">...</section>
        <section id="memory-vault" class="py-32 px-4 relative z-10">...</section>
        <section id="crew" class="py-32 px-4 relative z-10">...</section>
        <section id="comms" class="py-32 px-4 relative z-10">...</section>
        
        <footer>...</footer>
    </div>

    <div id="admin-view" class="theme-admin">...</div>

    <div id="toastContainer"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
