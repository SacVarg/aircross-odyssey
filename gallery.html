<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOYAGER | Memory Vault</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Inter', 'sans-serif'], space: ['Space Grotesk', 'sans-serif'] }, 
                    colors: { emerald: '#10b981', cyan: '#06b6d4', violet: '#8b5cf6', purple: '#a855f7' } 
                } 
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 min-h-screen pb-20 overflow-x-hidden text-slate-300">

    <!-- Background Effects -->
    <div class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black"></div>
    <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-purple-900/20 blur-[120px] pointer-events-none"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center bg-slate-900/50 backdrop-blur-xl border-b border-slate-800 shadow-sm">
        <a href="index.html" class="font-space font-bold text-xl tracking-[0.2em] text-white flex items-center gap-2 hover:text-purple-400 transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5 text-purple-500"></i> BACK
        </a>
        <div class="text-xs font-space font-bold tracking-widest text-purple-400 bg-purple-900/30 px-4 py-2 rounded-full border border-purple-500/30">
            MEMORY VAULT
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto pt-32 px-4 relative z-10">
        
        <!-- Header & Controls -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl md:text-5xl font-black font-space uppercase text-white tracking-tight drop-shadow-[0_0_15px_rgba(168,85,247,0.3)]">
                    Archived Memories
                </h1>
                <p class="text-slate-400 mt-2 font-medium tracking-wide">Secure visual logs from the Aircross Odyssey.</p>
            </div>
            
            <!-- View Toggles -->
            <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 p-1 rounded-xl shadow-lg">
                <button onclick="window.toggleGalleryView('grid')" id="btn-view-grid" class="p-2.5 rounded-lg bg-slate-800 text-purple-400 shadow-sm transition-all" title="Grid View">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i>
                </button>
                <button onclick="window.toggleGalleryView('list')" id="btn-view-list" class="p-2.5 rounded-lg text-slate-500 hover:text-slate-300 transition-all" title="List View">
                    <i data-lucide="list" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Dynamic Container injected by JS -->
        <div id="gallery-dynamic-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="text-center col-span-full py-20 text-slate-500 font-space text-sm">
                <i data-lucide="loader" class="w-8 h-8 animate-spin mx-auto mb-4 text-purple-500"></i> Decrypting visual logs...
            </div>
        </div>

        <div id="emptyGalleryMessage" class="text-center py-20 hidden">
            <i data-lucide="image-off" class="w-16 h-16 mx-auto text-slate-700 mb-4"></i>
            <p class="text-slate-500 font-space font-bold tracking-widest">VAULT IS EMPTY</p>
        </div>
    </div>

    <!-- Gallery Lightbox -->
    <div id="galleryLightbox" class="gallery-lightbox" onclick="if(event.target === this) window.closeLightbox()">
        <div class="lightbox-content">
            <img id="lightboxImage" class="lightbox-image" src="" alt="Gallery image">
            <button class="lightbox-nav lightbox-prev" onclick="window.previousGalleryImage()">&lt;</button>
            <button class="lightbox-nav lightbox-next" onclick="window.nextGalleryImage()">&gt;</button>
            <button class="lightbox-close" onclick="window.closeLightbox()">&times;</button>
        </div>
    </div>

    <!-- Hidden element to pass view state to app.js securely -->
    <input type="hidden" id="gallery-view-state" value="grid">

    <script type="module" src="app.js"></script>
</body>
</html>
