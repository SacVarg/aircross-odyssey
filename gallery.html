<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOYAGER | Memory Vault</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root { 
            /* Fallback colors. The script below will instantly overwrite this with your Firebase theme. */
            --theme-hex: #38bdf8; 
            --theme-rgb: 56, 189, 248; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0f172a; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Dynamic Background exactly mirroring the index page */
        .immersive-bg {
            position: fixed; inset: 0; z-index: -10;
            background-size: cover; background-position: center; background-attachment: fixed;
            background-color: #0f172a;
            transition: background-image 0.5s ease-in-out;
        }
        
        .bg-overlay {
            position: fixed; inset: 0; z-index: -9;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.7) 0%, rgba(15, 23, 42, 0.95) 100%);
        }

        /* Theme Application Classes */
        .theme-text { color: var(--theme-hex) !important; }
        .theme-bg { background-color: var(--theme-hex) !important; }

        /* Main UI Container */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ========================================================
           CSS INTERCEPTORS FOR GALLERY RENDERING
           These rules automatically intercept and restyle the HTML 
           that your existing app.js spits out.
           ======================================================== */

        /* 1. Global Picture Border & Shadows */
        #gallery-dynamic-container > div {
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
            border-radius: 1.5rem !important;
            background: rgba(0, 0, 0, 0.2) !important;
        }

        /* 2. GRID VIEW SPECIFIC FIXES */
        
        /* Force the overlay to ALWAYS be visible (fixes the missing download button issue) */
        #gallery-dynamic-container.grid > div > div.absolute.inset-0 {
            opacity: 1 !important; 
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0) 60%) !important;
            padding: 1rem !important;
        }

        /* Style the Date box to look like plain text with a shadow */
        #gallery-dynamic-container.grid > div > div.absolute > div > div:first-child {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            font-size: 0.75rem !important;
            color: white !important;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8) !important;
        }

        /* Inject the "Image Name" directly before the Date */
        #gallery-dynamic-container.grid > div > div.absolute > div > div:first-child::before {
            content: "VAULT LOG // ";
            color: var(--theme-hex);
            font-weight: 800;
        }

        /* Make Grid Buttons stand out */
        #gallery-dynamic-container.grid > div button[title="Download"] {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            backdrop-filter: blur(8px) !important;
        }
        #gallery-dynamic-container.grid > div button[title="Enlarge"] {
            background: var(--theme-hex) !important;
            color: #000 !important;
            border: none !important;
            box-shadow: 0 0 15px rgba(var(--theme-rgb), 0.4) !important;
        }

        /* 3. LIST VIEW SPECIFIC FIXES */
        
        /* Make sure the main list wrapper is relative so we can overlay the bottom bar */
        #gallery-dynamic-container.flex > div {
            position: relative !important;
        }

        /* Pull the text and button bar UP and INSIDE the image */
        #gallery-dynamic-container.flex > div > div.p-6 {
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.4) 60%, transparent 100%) !important;
            border: none !important;
            backdrop-filter: none !important;
            padding: 2rem 1.5rem 1.5rem 1.5rem !important;
            pointer-events: none !important; /* Lets you click the image behind the gradient to open the lightbox */
        }

        /* Re-enable clicking on the actual text and buttons inside the overlay */
        #gallery-dynamic-container.flex > div > div.p-6 > div {
            pointer-events: auto !important;
        }

        /* Style the Name (LOG ENTRY) and Date in List view */
        #gallery-dynamic-container.flex > div > div.p-6 p:first-child {
            color: var(--theme-hex) !important;
            font-size: 0.65rem !important;
        }
        #gallery-dynamic-container.flex > div > div.p-6 p:last-child {
            color: white !important;
            font-size: 0.9rem !important;
            font-weight: 700 !important;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8) !important;
        }

        /* Style the Download button in List View to match theme */
        #gallery-dynamic-container.flex > div > div.p-6 button {
            background-color: var(--theme-hex) !important;
            color: #000 !important;
            border: none !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5) !important;
        }

        /* ========================================================
           LIGHTBOX UI
           ======================================================== */
        .gallery-lightbox {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .gallery-lightbox.active { display: flex; opacity: 1; }
        .lightbox-content { position: relative; max-width: 90vw; max-height: 90vh; }
        .lightbox-image {
            max-width: 100%; max-height: 90vh; object-fit: contain;
            border-radius: 1rem; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .lightbox-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2);
            width: 3.5rem; height: 3.5rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; cursor: pointer; transition: all 0.2s;
            backdrop-filter: blur(8px);
        }
        .lightbox-nav:hover { background: var(--theme-hex); color: #000; border-color: var(--theme-hex); }
        .lightbox-prev { left: -5rem; }
        .lightbox-next { right: -5rem; }
        .lightbox-close {
            position: absolute; top: -3.5rem; right: -1rem;
            color: white; font-size: 2.5rem; cursor: pointer;
            background: transparent; border: none; transition: color 0.2s;
        }
        .lightbox-close:hover { color: var(--theme-hex); }

        @media (max-width: 768px) {
            .lightbox-prev { left: 0.5rem; width: 2.5rem; height: 2.5rem; }
            .lightbox-next { right: 0.5rem; width: 2.5rem; height: 2.5rem; }
            .lightbox-close { 
                top: 0.5rem; right: 0.5rem; background: rgba(0,0,0,0.6); 
                width: 2.5rem; height: 2.5rem; border-radius: 50%; 
                display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="pb-20">

    <div id="public-view" class="hidden"></div>

    <div class="immersive-bg" id="global-bg-layer"></div>
    <div class="bg-overlay"></div>

    <nav class="fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center bg-slate-900/50 backdrop-blur-md border-b border-white/10">
        <a href="index.html" class="font-space font-bold text-sm tracking-widest text-white flex items-center gap-2 hover:text-white/70 transition-colors uppercase">
            <i data-lucide="arrow-left" class="w-5 h-5 theme-text"></i> BACK
        </a>
        <div class="text-[10px] font-space font-bold tracking-widest theme-text bg-white/5 px-4 py-2 rounded-full border border-white/10 uppercase">
            Memory Vault
        </div>
    </nav>

    <div class="max-w-7xl mx-auto pt-32 px-4 md:px-8 relative z-10">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6 glass-panel p-6 rounded-[2rem] border-t-2 border-t-theme shadow-2xl bg-black/20">
            <div class="text-center md:text-left">
                <h1 class="text-3xl md:text-5xl font-black font-space uppercase text-white tracking-tighter">
                    Archived Memories
                </h1>
                <p class="text-white/50 mt-2 font-medium tracking-wide text-sm">Secure visual logs from the expedition.</p>
            </div>
            
            <div class="flex items-center gap-2 bg-black/40 border border-white/10 p-1.5 rounded-xl shadow-inner">
                <button onclick="window.toggleGalleryView('grid')" id="btn-view-grid" class="p-2.5 rounded-lg bg-white/10 theme-text border border-white/10 shadow-sm transition-all" title="Grid View">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i>
                </button>
                <button onclick="window.toggleGalleryView('list')" id="btn-view-list" class="p-2.5 rounded-lg text-white/40 hover:text-white/80 transition-all" title="List View">
                    <i data-lucide="list" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div id="gallery-dynamic-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <div class="text-center col-span-full py-20 text-white/40 font-space text-sm tracking-widest uppercase font-bold">
                <i data-lucide="loader" class="w-6 h-6 animate-spin mx-auto mb-3 theme-text"></i> Decrypting visual logs...
            </div>
        </div>

        <div id="emptyGalleryMessage" class="text-center py-20 hidden">
            <i data-lucide="image-off" class="w-16 h-16 mx-auto text-white/20 mb-4"></i>
            <p class="text-white/40 font-space font-bold tracking-widest uppercase">VAULT IS EMPTY</p>
        </div>
    </div>

    <div id="galleryLightbox" class="gallery-lightbox" onclick="if(event.target === this) window.closeLightbox()">
        <div class="lightbox-content">
            <img id="lightboxImage" class="lightbox-image" src="" alt="Gallery image">
            <button class="lightbox-nav lightbox-prev" onclick="window.previousGalleryImage()">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <button class="lightbox-nav lightbox-next" onclick="window.nextGalleryImage()">
                <i data-lucide="chevron-right" class="w-6 h-6"></i>
            </button>
            <button class="lightbox-close" onclick="window.closeLightbox()">&times;</button>
        </div>
    </div>

    <input type="hidden" id="gallery-view-state" value="grid">

    <script type="module" src="app.js"></script>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA9FiNMZI50q6AeTS0Fiw1Qs-VVMmVI4Os",
            authDomain: "aircross-odyssey-f6e2f.firebaseapp.com",
            projectId: "aircross-odyssey-f6e2f",
            storageBucket: "aircross-odyssey-f6e2f.firebasestorage.app",
            messagingSenderId: "641282553954",
            appId: "1:641282553954:web:4b3fa456d9eda8adf2393b"
        };
        
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const db = getFirestore(app);

        // Fetch dynamic theme and background image globally
        onSnapshot(doc(db, 'artifacts/aircross-odyssey-main/public/data/trip_meta/latest'), (snap) => {
            if (snap.exists()) {
                const data = snap.data();
                if (data.themeColor) {
                    document.documentElement.style.setProperty('--theme-hex', data.themeColor);
                }
                if (data.bgImage) {
                    document.getElementById('global-bg-layer').style.backgroundImage = `url('${data.bgImage}')`;
                }
            }
        });

        // Initialize Lucide icons on load
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>
</html>
