<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOYAGER | Tactical Comms Radio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .cyber-grid { background-image: radial-gradient(circle, rgba(16, 185, 129, 0.05) 1px, transparent 1px); background-size: 30px 30px; }
        .ptt-btn { transition: all 0.2s; user-select: none; touch-action: none; }
        .ptt-btn.transmitting { transform: scale(0.95); box-shadow: 0 0 50px #ec4899; border-color: #ec4899; background: #881337; }
        .is-speaking { border: 3px solid #ec4899 !important; box-shadow: 0 0 30px #ec4899; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans cyber-grid flex flex-col">

    <nav class="w-full px-6 py-4 flex justify-between items-center bg-slate-900/60 backdrop-blur-xl border-b border-slate-800">
        <div class="font-space font-bold text-sm tracking-[0.3em] text-white flex items-center gap-2">
            <i data-lucide="radio" class="w-4 h-4 text-pink-500"></i> COMMS LINK // MESH_V1
        </div>
        <button onclick="window.location.href='index.html'" class="text-xs font-space font-bold tracking-widest text-slate-400 hover:text-emerald-400 transition-colors flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-3 h-3"></i> RETURN
        </button>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center p-6 max-w-lg w-full mx-auto">
        
        <div id="setup-panel" class="w-full bg-slate-900/50 border border-slate-800 p-8 rounded-3xl shadow-2xl backdrop-blur-lg">
            <h1 class="text-lg font-space font-black text-center mb-6 tracking-widest uppercase">Frequency Auth</h1>
            <input type="text" id="callsign-input" placeholder="ENTER CALLSIGN" class="w-full bg-slate-950 border border-slate-700 p-4 rounded-xl text-center font-bold tracking-widest uppercase mb-4 focus:border-emerald-500 outline-none">
            <button id="join-btn" onclick="window.initializeTacticalRadio()" class="w-full py-4 bg-emerald-500 text-slate-950 font-black rounded-xl hover:bg-emerald-400 transition-colors">JOIN FREQUENCY</button>
        </div>

        <div id="radio-panel" class="w-full space-y-8 hidden">
            <div id="peer-roster-grid" class="grid grid-cols-2 gap-4 w-full"></div>
            <button id="ptt-btn" class="ptt-btn w-48 h-48 rounded-full border-4 border-slate-800 bg-slate-900 mx-auto flex flex-col items-center justify-center gap-2 shadow-2xl">
                <i data-lucide="mic" class="w-12 h-12"></i>
                <span class="font-space font-bold tracking-widest">HOLD TO TALK</span>
            </button>
        </div>
    </main>

    <div id="audio-renderer-sink" class="hidden"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, collection, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const app = initializeApp({
            apiKey: "AIzaSyA9FiNMZI50q6AeTS0Fiw1Qs-VVMmVI4Os",
            authDomain: "aircross-odyssey-f6e2f.firebaseapp.com",
            projectId: "aircross-odyssey-f6e2f"
        });

        const db = getFirestore(app);
        const auth = getAuth(app);
        let localStream, localPeerId = Math.random().toString(36).substring(2, 9);
        const runtimeConnections = {};

        // Automatic Cleanup: Remove user from DB on close or refresh
        window.addEventListener('beforeunload', async () => {
            await deleteDoc(doc(db, 'artifacts', 'aircross-odyssey-main', 'public', 'data', 'radio_frequency', 'lobby', 'nodes', localPeerId));
        });

        window.initializeTacticalRadio = async () => {
            const callsign = document.getElementById('callsign-input').value.toUpperCase();
            if (!callsign) return alert("ENTER CALLSIGN");

            await signInAnonymously(auth);
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            localStream.getAudioTracks().forEach(t => t.enabled = false);

            document.getElementById('setup-panel').classList.add('hidden');
            document.getElementById('radio-panel').classList.remove('hidden');

            setupPTT();
            initSignaling(callsign);
            lucide.createIcons();
        };

        function setupPTT() {
            const btn = document.getElementById('ptt-btn');
            const toggle = (active) => {
                localStream.getAudioTracks()[0].enabled = active;
                active ? btn.classList.add('transmitting') : btn.classList.remove('transmitting');
            };
            btn.onmousedown = btn.ontouchstart = () => toggle(true);
            btn.onmouseup = btn.ontouchend = () => toggle(false);
        }

        async function initSignaling(callsign) {
            const nodesRef = collection(doc(db, 'artifacts', 'aircross-odyssey-main', 'public', 'data', 'radio_frequency', 'lobby'), 'nodes');
            await setDoc(doc(nodesRef, localPeerId), { id: localPeerId, callsign, active: false });

            onSnapshot(nodesRef, (snap) => {
                const grid = document.getElementById('peer-roster-grid');
                grid.innerHTML = '';
                snap.forEach(doc => {
                    const data = doc.data();
                    grid.innerHTML += `<div id="peer-${data.id}" class="p-4 bg-slate-900 border border-slate-800 rounded-xl font-space font-bold text-xs uppercase">${data.callsign}</div>`;
                });
            });
        }

        // Active Speaker Highlighter
        function monitorSpeaker(stream, peerId) {
            const ctx = new AudioContext();
            const analyzer = ctx.createAnalyser();
            ctx.createMediaStreamSource(stream).connect(analyzer);
            const pcm = new Float32Array(analyzer.fftSize);
            function tick() {
                analyzer.getFloatTimeDomainData(pcm);
                let sum = 0;
                for(let i=0; i<pcm.length; i++) sum += pcm[i] * pcm[i];
                let amp = Math.sqrt(sum / pcm.length);
                const el = document.getElementById(`peer-${peerId}`);
                if(el) { amp > 0.05 ? el.classList.add('is-speaking') : el.classList.remove('is-speaking'); }
                requestAnimationFrame(tick);
            }
            tick();
        }

        lucide.createIcons();
    </script>
</body>
</html>
