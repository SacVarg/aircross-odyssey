<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOYAGER | Tactical Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], space: ['Space Grotesk', 'sans-serif'] } } } }
    </script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; overflow-x: hidden; }
        .cyber-grid { position: fixed; inset: 0; z-index: -2; background-image: linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(6, 182, 212, 0.05) 1px, transparent 1px); background-size: 40px 40px; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1.25rem; }
        .ptt-btn { box-shadow: 0 0 30px rgba(6, 182, 212, 0.3); transition: all 0.1s; }
        .ptt-btn:active { transform: scale(0.95); box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 10px rgba(6, 182, 212, 0.5); }
        .ptt-btn.transmitting { background-color: #ef4444; box-shadow: 0 0 40px rgba(239, 68, 68, 0.6); }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <div class="cyber-grid"></div>

    <nav class="w-full z-40 bg-slate-900/50 backdrop-blur-xl border-b border-slate-700/50 px-4 py-4 fixed top-0">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-space font-bold tracking-[0.2em] text-white flex items-center gap-2">
                <i data-lucide="compass" class="w-5 h-5 text-cyan-400"></i> VOYAGER
            </a>
            <button id="btn-enable-notifs" class="text-xs font-space font-bold tracking-widest text-violet-400 bg-violet-900/30 px-3 py-1.5 rounded-full border border-violet-500/30 hidden">
                ENABLE ALERTS
            </button>
        </div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center pt-20 px-4 max-w-md mx-auto w-full">
        <div class="text-center mb-8 w-full">
            <h1 class="text-3xl font-space font-black tracking-widest text-white mb-2">UHF RADIO</h1>
            <p id="status-text" class="text-slate-400 text-sm font-medium">DISCONNECTED</p>
        </div>

        <div class="glass-panel w-full p-6 flex flex-col items-center mb-8">
            <input type="text" id="callsign-input" placeholder="ENTER CALLSIGN" class="w-full bg-slate-800 text-center text-white font-space font-bold tracking-widest py-3 rounded-lg border border-slate-700 mb-6 outline-none focus:border-cyan-400">
            
            <button id="btn-join" class="w-full py-4 bg-cyan-500 text-slate-900 font-space font-black tracking-widest rounded-xl hover:bg-cyan-400 transition-colors mb-4">
                JOIN FREQUENCY
            </button>
        </div>

        <div id="radio-interface" class="w-full flex flex-col items-center hidden">
            <button id="btn-ptt" class="ptt-btn w-40 h-40 rounded-full bg-cyan-500 flex flex-col items-center justify-center text-slate-900 border-4 border-slate-800 touch-none select-none mb-8">
                <i data-lucide="mic" class="w-12 h-12 mb-2"></i>
                <span class="font-space font-black tracking-widest text-sm">HOLD TO TALK</span>
            </button>

            <div class="w-full glass-panel p-4">
                <h3 class="text-xs text-slate-400 font-bold tracking-widest mb-3 text-center">ACTIVE ON FREQUENCY</h3>
                <div id="active-users" class="flex flex-wrap justify-center gap-2"></div>
            </div>
        </div>
    </main>

    <audio id="remote-audio" autoplay></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA9FiNMZI50q6AeTS0Fiw1Qs-VVMmVI4Os",
            authDomain: "aircross-odyssey-f6e2f.firebaseapp.com",
            projectId: "aircross-odyssey-f6e2f",
            storageBucket: "aircross-odyssey-f6e2f.firebasestorage.app",
            messagingSenderId: "641282553954",
            appId: "1:641282553954:web:4b3fa456d9eda8adf2393b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const messaging = getMessaging(app);

        lucide.createIcons();
        signInAnonymously(auth);

        // --- PUSH NOTIFICATION SETUP ---
        const PUBLIC_VAPID_KEY = "BEI4yDAnC84PRX-I0l_r8Fv2tKdr4L3cUXRgBxzSYysbeATLAVYv2el1yMxw0WyI9ofIZM4YBHoUuuiIhy1x8SQ"; // <--- PASTE VAPID KEY HERE

        const notifBtn = document.getElementById('btn-enable-notifs');
        
        // Show the button if notifications aren't granted yet
        if (Notification.permission !== "granted") {
            notifBtn.classList.remove('hidden');
        }

        notifBtn.addEventListener('click', async () => {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const token = await getToken(messaging, { vapidKey: PUBLIC_VAPID_KEY });
                    if (token) {
                        await setDoc(doc(db, "artifacts/aircross-odyssey-main/public/data/fcm_tokens", token), {
                            token: token,
                            timestamp: Date.now()
                        });
                        notifBtn.classList.add('hidden');
                        alert("Alerts enabled!");
                    }
                }
            } catch (error) {
                console.error("Token registration failed:", error);
            }
        });

        // Handle foreground messages
        onMessage(messaging, (payload) => {
            console.log('Message received. ', payload);
        });

        // --- RADIO LOGIC ---
        let localStream;
        let peerConnection;
        let callsign = "";

        // Minimal configuration for WebRTC
        const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

        document.getElementById('btn-join').addEventListener('click', async () => {
            callsign = document.getElementById('callsign-input').value.trim();
            if (!callsign) return alert("Enter a callsign");

            document.getElementById('callsign-input').parentElement.classList.add('hidden');
            document.getElementById('radio-interface').classList.remove('hidden');
            document.getElementById('status-text').textContent = "CONNECTED TO FREQUENCY";
            document.getElementById('status-text').classList.replace('text-slate-400', 'text-cyan-400');

            // 1. Fire the webhook to Vercel to send the push notification to everyone else!
            try {
                await fetch('/api/notify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ caller: callsign })
                });
            } catch (e) { console.error("Vercel backend unreachable", e); }

            // 2. Add self to active users
            await setDoc(doc(db, "artifacts/aircross-odyssey-main/public/data/radio_frequency", callsign), { 
                active: true, timestamp: Date.now() 
            });

            setupWebRTC();
        });

        // WebRTC setup (Dummy audio connection for structural completeness)
        async function setupWebRTC() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localStream.getTracks().forEach(track => track.enabled = false); // Start muted

                // Listen for active users UI
                onSnapshot(collection(db, "artifacts/aircross-odyssey-main/public/data/radio_frequency"), (snapshot) => {
                    const activeDiv = document.getElementById('active-users');
                    activeDiv.innerHTML = "";
                    snapshot.forEach(doc => {
                        if (Date.now() - doc.data().timestamp < 3600000) { // Only show recent
                            activeDiv.innerHTML += `<span class="bg-slate-800 text-cyan-400 text-xs font-bold px-3 py-1 rounded-full border border-slate-700">${doc.id}</span>`;
                        }
                    });
                });

            } catch (e) {
                console.error("Mic access denied", e);
                alert("Microphone access is required for the radio.");
            }
        }

        // Push-to-Talk Logic
        const pttBtn = document.getElementById('btn-ptt');
        
        const startTransmit = () => {
            if(!localStream) return;
            localStream.getTracks().forEach(track => track.enabled = true);
            pttBtn.classList.add('transmitting');
            pttBtn.querySelector('span').textContent = "TRANSMITTING...";
        };

        const stopTransmit = () => {
            if(!localStream) return;
            localStream.getTracks().forEach(track => track.enabled = false);
            pttBtn.classList.remove('transmitting');
            pttBtn.querySelector('span').textContent = "HOLD TO TALK";
        };

        pttBtn.addEventListener('mousedown', startTransmit);
        pttBtn.addEventListener('mouseup', stopTransmit);
        pttBtn.addEventListener('mouseleave', stopTransmit);
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmit(); });
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmit(); });
    </script>
</body>
</html>
