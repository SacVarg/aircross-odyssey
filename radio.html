<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOYAGER | Walkie Talkie</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            /* These will be overridden by the Firebase listener instantly */
            --theme-hex: #38bdf8;
            --theme-rgb: 56, 189, 248;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0f172a; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .immersive-bg {
            position: fixed; inset: 0; z-index: -10;
            background-size: cover; background-position: center; background-attachment: fixed;
            background-color: #0f172a;
            transition: background-image 0.5s ease-in-out;
        }
        
        .bg-overlay {
            position: fixed; inset: 0; z-index: -9;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.6) 0%, rgba(15, 23, 42, 0.95) 100%);
        }

        .theme-text { color: var(--theme-hex) !important; }
        .theme-bg { background-color: var(--theme-hex) !important; }
        .theme-border { border-color: var(--theme-hex) !important; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ptt-btn { 
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 30px rgba(var(--theme-rgb), 0.2);
        }
        .ptt-btn:active { transform: scale(0.94); }
        .ptt-btn.transmitting { background: #ef4444 !important; border-color: #f87171 !important; color: white !important; box-shadow: 0 0 50px rgba(239, 68, 68, 0.6); }

        .hide { display: none !important; }

        /* Custom WhatsApp Button Style */
        .whatsapp-btn {
            background-color: rgba(37, 211, 102, 0.1);
            border: 1px solid rgba(37, 211, 102, 0.4);
            color: #25D366;
            transition: all 0.2s ease;
        }
        .whatsapp-btn:hover {
            background-color: rgba(37, 211, 102, 0.2);
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.3);
        }
    </style>
</head>
<body class="flex flex-col">

    <div id="public-view" class="hidden"></div>

    <div class="immersive-bg" id="global-bg-layer"></div>
    <div class="bg-overlay"></div>

    <nav class="fixed top-0 w-full z-50 px-6 lg:px-12 py-4 flex justify-between items-center bg-slate-900/50 backdrop-blur-md border-b border-white/10">
        <a href="index.html" class="font-space font-bold text-sm tracking-widest text-white flex items-center gap-2 hover:text-white/70 transition-colors uppercase">
            <i data-lucide="arrow-left" class="w-5 h-5 theme-text"></i> BACK
        </a>
        <div class="text-[10px] font-space font-bold tracking-widest theme-text bg-white/5 px-4 py-2 rounded-full border border-white/10 uppercase">
            Walkie Talkie
        </div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center pt-24 pb-12 px-4 max-w-md mx-auto w-full">
        <div class="text-center mb-8 w-full">
            <h1 class="text-3xl font-space font-black tracking-widest text-white mb-2 uppercase">
                Walkie Talkie
            </h1>
            <p id="status-text" class="text-white/50 text-[10px] font-space font-bold tracking-widest uppercase">
                SYSTEM DISCONNECTED
            </p>
        </div>

        <div id="view-gate" class="glass-panel w-full p-6 flex flex-col items-center rounded-[2rem] shadow-2xl border-t-2 border-t-theme">
            <div class="w-full mb-6">
                <label class="text-[10px] text-white/50 font-space font-bold tracking-widest mb-2 block uppercase">Name / Callsign</label>
                <input type="text" id="callsign-input" placeholder="e.g. MISSION PILOT" class="w-full bg-black/40 border border-white/10 text-center text-white font-space font-bold tracking-widest py-3 md:py-4 rounded-xl outline-none focus:border-white/30 transition-colors placeholder:text-white/20 uppercase">
            </div>
            
            <button id="btn-join" class="w-full py-4 theme-bg text-black font-space font-black tracking-widest rounded-xl hover:opacity-90 transition-opacity shadow-lg uppercase text-sm">
                JOIN LOBBY
            </button>
        </div>

        <div id="view-radio" class="w-full flex flex-col items-center hide">
            <button id="btn-ptt" class="ptt-btn w-44 h-44 rounded-full theme-bg flex flex-col items-center justify-center text-black border-8 border-white/10 touch-none select-none mb-8 cursor-pointer">
                <i data-lucide="mic" class="w-12 h-12 mb-2"></i>
                <span id="ptt-label" class="font-space font-black tracking-widest text-[10px] uppercase">Hold to transmit</span>
            </button>

            <div class="w-full glass-panel p-5 rounded-2xl mb-4">
                <h3 class="text-[10px] text-white/50 font-space font-bold tracking-widest mb-4 text-center uppercase">Active Signals</h3>
                <div id="active-users" class="flex flex-wrap justify-center gap-2"></div>
            </div>

            <button id="btn-alerts" onclick="window.toggleAudioAlerts()" class="w-full py-3 mb-3 border border-white/20 bg-white/5 font-space font-bold tracking-widest text-[10px] rounded-xl flex justify-center items-center gap-2 uppercase text-white/50 hover:text-white transition-colors shadow-sm">
                <i data-lucide="bell-off" id="alert-icon" class="w-4 h-4"></i>
                <span id="alert-text">Enable Audio Alerts</span>
            </button>

            <button onclick="window.shareToWhatsApp()" class="w-full py-3.5 whatsapp-btn font-space font-bold tracking-widest text-[10px] rounded-xl flex justify-center items-center gap-2 uppercase">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-whatsapp" viewBox="0 0 16 16">
                    <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c-.003 1.396.366 2.76 1.056 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                </svg>
                PAGE CREW
            </button>
        </div>
    </main>

    <div id="remote-audio-pool" class="hidden"></div>

    <script type="module" src="app.js"></script>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Connect to Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA9FiNMZI50q6AeTS0Fiw1Qs-VVMmVI4Os",
            authDomain: "aircross-odyssey-f6e2f.firebaseapp.com",
            projectId: "aircross-odyssey-f6e2f",
            storageBucket: "aircross-odyssey-f6e2f.firebasestorage.app",
            messagingSenderId: "641282553954",
            appId: "1:641282553954:web:4b3fa456d9eda8adf2393b"
        };
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "aircross-odyssey-main";

        // Globals
        let localStream = null;
        let localCallsign = "";
        let heartbeatInterval = null;
        const peerConnections = {}; 
        const rtcConfig = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };
        
        let alertsEnabled = false;

        // Helper: Convert hex to RGB for the theme engine
        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : "56, 189, 248";
        }

        // Apply theme from Firebase
        onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'trip_meta', 'latest'), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const root = document.documentElement;
                if(data.themeColor) {
                    root.style.setProperty('--theme-hex', data.themeColor);
                    root.style.setProperty('--theme-rgb', hexToRgb(data.themeColor));
                }
                const bgLayer = document.getElementById('global-bg-layer');
                if (bgLayer && data.bgImage) bgLayer.style.backgroundImage = `url('${data.bgImage}')`;
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });

        signInAnonymously(auth).catch(err => console.error("Auth failed: " + err.message));

        // WHATSAPP SHARE LOGIC
        window.shareToWhatsApp = () => {
            if (!localCallsign) return;
            const currentUrl = window.location.href;
            const message = `Hi, I am ${localCallsign} waiting in the lobby. Please join: ${currentUrl}`;
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        };

        // AUDIO ALERTS LOGIC
        window.toggleAudioAlerts = () => {
            alertsEnabled = !alertsEnabled;
            const icon = document.getElementById('alert-icon');
            const text = document.getElementById('alert-text');
            const btn = document.getElementById('btn-alerts');
            
            if (alertsEnabled) {
                icon.setAttribute('data-lucide', 'bell');
                text.textContent = 'Audio Alerts: ON';
                btn.classList.add('theme-text', 'theme-border');
                btn.classList.remove('text-white/50', 'border-white/20');
                window.playAlertBeep(800, 150); // Play test beep
            } else {
                icon.setAttribute('data-lucide', 'bell-off');
                text.textContent = 'Enable Audio Alerts';
                btn.classList.remove('theme-text', 'theme-border');
                btn.classList.add('text-white/50', 'border-white/20');
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        window.playAlertBeep = (freq = 600, duration = 150) => {
            if (!alertsEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime); // keep volume low
                osc.start();
                setTimeout(() => osc.stop(), duration);
            } catch (e) {}
        };

        // RADIO JOIN LOGIC
        document.getElementById('btn-join').addEventListener('click', async () => {
            localCallsign = document.getElementById('callsign-input').value.trim().toUpperCase();
            if (!localCallsign) return alert("Please enter a name.");

            document.getElementById('view-gate').classList.add('hide');
            document.getElementById('view-radio').classList.remove('hide');
            document.getElementById('status-text').textContent = `ONLINE // ${localCallsign}`;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                localStream.getTracks().forEach(track => track.enabled = false);
            } catch (err) { alert("Microphone access is required."); return; }

            await setDoc(doc(db, "artifacts/aircross-odyssey-main/public/data/radio_frequency", localCallsign), {
                active: true, timestamp: Date.now()
            });

            heartbeatInterval = setInterval(() => {
                if (localCallsign) {
                    setDoc(doc(db, "artifacts/aircross-odyssey-main/public/data/radio_frequency", localCallsign), {
                        active: true, timestamp: Date.now()
                    }, { merge: true });
                }
            }, 5000);

            initializeMeshSignaling();
        });

        // WEBRTC SIGNALING
        function initializeMeshSignaling() {
            const freqCollection = collection(db, "artifacts/aircross-odyssey-main/public/data/radio_frequency");
            onSnapshot(freqCollection, (snapshot) => {
                const rosterDiv = document.getElementById('active-users');
                rosterDiv.innerHTML = "";
                snapshot.forEach(async (userDoc) => {
                    const peerCallsign = userDoc.id;
                    const lastPulse = userDoc.data().timestamp;
                    if (Date.now() - lastPulse > 15000) return; 
                    
                    if (peerCallsign === localCallsign) {
                        rosterDiv.innerHTML += `<span class="bg-white/10 text-white text-[10px] font-space font-bold px-3 py-1.5 rounded-full border border-white/20">${peerCallsign} (YOU)</span>`;
                    } else {
                        rosterDiv.innerHTML += `<span class="bg-black/40 text-white/70 text-[10px] font-space font-bold px-3 py-1.5 rounded-full border border-white/10">${peerCallsign}</span>`;
                        if (!peerConnections[peerCallsign] && localCallsign.localeCompare(peerCallsign) < 0) {
                            // Beep when a new user connects
                            window.playAlertBeep(900, 200);
                            await initiatePeerConnection(peerCallsign);
                        }
                    }
                });
            });

            onSnapshot(collection(db, `artifacts/aircross-odyssey-main/public/data/radio_frequency/${localCallsign}/offers`), (snapshot) => {
                snapshot.forEach(async (change) => {
                    if (change.data().processed) return;
                    await handleIncomingOffer(change.id, change.data().offer);
                    await deleteDoc(change.ref);
                });
            });

            onSnapshot(collection(db, `artifacts/aircross-odyssey-main/public/data/radio_frequency/${localCallsign}/answers`), (snapshot) => {
                snapshot.forEach(async (change) => {
                    if (peerConnections[change.id]) await peerConnections[change.id].setRemoteDescription(new RTCSessionDescription(change.data().answer));
                    await deleteDoc(change.ref);
                });
            });

            onSnapshot(collection(db, `artifacts/aircross-odyssey-main/public/data/radio_frequency/${localCallsign}/candidates`), (snapshot) => {
                snapshot.forEach(async (change) => {
                    if (peerConnections[change.id]) {
                        try { await peerConnections[change.id].addIceCandidate(new RTCIceCandidate(change.data().candidate)); } catch (e) {}
                    }
                    await deleteDoc(change.ref);
                });
            });
        }

        async function initiatePeerConnection(peerCallsign) {
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[peerCallsign] = pc;
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.onicecandidate = (event) => {
                if (event.candidate) setDoc(doc(db, `artifacts/aircross-odyssey-main/public/data/radio_frequency/${peerCallsign}/candidates`, localCallsign), { candidate: event.candidate.toJSON(), timestamp: Date.now() });
            };
            pc.ontrack = (event) => bindRemoteAudioStream(peerCallsign, event.streams[0]);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await setDoc(doc(db, `artifacts/aircross-odyssey-main/public/data/radio_frequency/${peerCallsign}/offers`, localCallsign), { offer: { type: offer.type, sdp: offer.sdp }, timestamp: Date.now() });
        }

        async function handleIncomingOffer(senderCallsign, remoteOffer) {
            const pc = new RTCPeerConnection(rtcConfig);
            peerConnections[senderCallsign] = pc;
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.onicecandidate = (event) => {
                if (event.candidate) setDoc(doc(db, `artifacts/aircross-odyssey-main/public/data/radio_frequency/${senderCallsign}/candidates`, localCallsign), { candidate: event.candidate.toJSON(), timestamp: Date.now() });
            };
            pc.ontrack = (event) => bindRemoteAudioStream(senderCallsign, event.streams[0]);
            await pc.setRemoteDescription(new RTCSessionDescription(remoteOffer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            await setDoc(doc(db, `artifacts/aircross-odyssey-main/public/data/radio_frequency/${senderCallsign}/answers`, localCallsign), { answer: { type: answer.type, sdp: answer.sdp }, timestamp: Date.now() });
        }

        function bindRemoteAudioStream(callsign, stream) {
            const pool = document.getElementById('remote-audio-pool');
            let audioEl = document.getElementById(`audio-${callsign}`);
            if (!audioEl) {
                audioEl = document.createElement('audio'); audioEl.id = `audio-${callsign}`; audioEl.autoplay = true; pool.appendChild(audioEl);
            }
            audioEl.srcObject = stream;
        }

        // PTT LOGIC
        const pttBtn = document.getElementById('btn-ptt');
        const pttLabel = document.getElementById('ptt-label');
        const engageTransmission = () => { if (!localStream) return; localStream.getTracks().forEach(track => track.enabled = true); pttBtn.classList.add('transmitting'); pttLabel.textContent = "TRANSMITTING..."; };
        const severTransmission = () => { if (!localStream) return; localStream.getTracks().forEach(track => track.enabled = false); pttBtn.classList.remove('transmitting'); pttLabel.textContent = "HOLD TO TRANSMIT"; };

        pttBtn.addEventListener('mousedown', engageTransmission); 
        pttBtn.addEventListener('mouseup', severTransmission); 
        pttBtn.addEventListener('mouseleave', severTransmission);
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); engageTransmission(); }); 
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); severTransmission(); });
    </script>
</body>
</html>
