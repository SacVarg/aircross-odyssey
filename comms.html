<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOYAGER | Messenger</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { --theme-hex: #38bdf8; }
        html, body { 
            height: 100%; height: 100dvh; overflow: hidden; 
            background-color: #0f172a; color: #ffffff; 
            font-family: sans-serif; margin: 0;
        }

        .immersive-bg {
            position: absolute; inset: 0; z-index: -10;
            background-size: cover; background-position: center;
            background-color: #0f172a;
            transition: background-image 0.5s ease-in-out;
        }
        
        .bg-overlay {
            position: absolute; inset: 0; z-index: -9;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.7) 0%, rgba(15, 23, 42, 0.95) 100%);
        }

        .theme-bg { background-color: var(--theme-hex) !important; }
        .theme-text { color: var(--theme-hex) !important; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .comms-scrollbar::-webkit-scrollbar { width: 4px; }
        .comms-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col relative">

    <div class="immersive-bg" id="global-bg-layer"></div>
    <div class="bg-overlay"></div>

    <nav class="shrink-0 h-16 w-full z-50 px-6 flex items-center bg-slate-900/50 backdrop-blur-md border-b border-white/10">
        <a href="index.html" class="flex items-center gap-3 text-white hover:opacity-70 transition-opacity">
            <i data-lucide="arrow-left" class="w-5 h-5 theme-text"></i>
            <span class="font-bold text-sm uppercase tracking-widest">Back</span>
        </a>
    </nav>

    <main class="flex-1 w-full max-w-4xl mx-auto p-4 flex flex-col overflow-hidden relative z-10">
        <div class="glass-panel flex-1 flex flex-col rounded-3xl overflow-hidden border border-white/10">
            
            <div id="commsContainer" class="flex-1 overflow-y-auto p-4 custom-scrollbar flex flex-col">
                <div class="text-center py-10 text-white/30 text-sm m-auto">Syncing...</div>
            </div>

            <div class="shrink-0 p-3 bg-black/40 border-t border-white/10">
                <div id="audioAttachmentArea" class="hidden flex-col gap-2 mb-3 bg-black/60 border border-white/10 rounded-xl p-3">
                    <button id="deleteAudioBtn" onclick="window.localDeleteAudio()" class="hidden text-red-400">Delete</button>
                    <canvas id="audioVisualizer" class="w-full h-10 hidden"></canvas>
                    <audio id="audioPlayback" controls class="w-full hidden"></audio>
                </div>

                <div class="flex gap-2 items-end">
                    <select id="commAuthor" class="w-24 bg-black/40 border border-white/20 rounded-xl p-3 text-xs text-white">
                        <option value="Loading...">Name...</option>
                    </select>
                    <textarea id="commMessage" rows="1" class="flex-1 bg-black/40 border border-white/20 rounded-xl p-3 text-sm text-white resize-none"></textarea>
                    <button id="recordBtn" onclick="window.localToggleRecord()" class="w-12 h-12 bg-black/40 border border-white/20 rounded-xl text-white/50">
                        <i data-lucide="mic" class="w-5 h-5"></i>
                    </button>
                    <button onclick="window.localPostComm()" class="w-12 h-12 theme-bg text-black rounded-xl">
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        const app = initializeApp({ /* Your Config */ });
        const db = getFirestore(app);

        // This listener mirrors your index.html exactly, so it WILL load the background
        onSnapshot(doc(db, 'artifacts/aircross-odyssey-main/public/data/trip_meta/latest'), (snap) => {
            if (snap.exists()) {
                const data = snap.data();
                if (data.themeColor) document.documentElement.style.setProperty('--theme-hex', data.themeColor);
                if (data.bgImage) document.getElementById('global-bg-layer').style.backgroundImage = `url('${data.bgImage}')`;
            }
        });
        
        window.localToggleRecord = async () => { /* ... */ };
        window.localPostComm = async () => { /* ... */ };
        window.localDeleteAudio = () => { /* ... */ };
    </script>
</body>
</html>
