<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOYAGER | Messenger</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { 
            /* Fallback colors. App.js will overwrite this instantly. */
            --theme-hex: #38bdf8; 
            --theme-rgb: 56, 189, 248; 
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* Strict flex layout prevents the screen from being cut off by mobile keyboards */
        html, body { 
            height: 100%; 
            height: 100dvh; 
            overflow: hidden; 
            background-color: #0f172a; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            margin: 0;
        }

        /* Dynamic Background container */
        .immersive-bg {
            position: absolute; inset: 0; z-index: -10;
            background-size: cover; background-position: center;
            background-color: #0f172a;
            transition: background-image 0.5s ease-in-out;
        }
        
        .bg-overlay {
            position: absolute; inset: 0; z-index: -9;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.7) 0%, rgba(15, 23, 42, 0.95) 100%);
        }

        .theme-text { color: var(--theme-hex) !important; }
        .theme-bg { background-color: var(--theme-hex) !important; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* WhatsApp-Style Chat Bubbles */
        #commsContainer > div {
            border: none !important;
            box-shadow: none !important;
            padding: 12px 16px !important;
            border-radius: 1.25rem !important;
            max-width: 85% !important;
            background: rgba(255, 255, 255, 0.08) !important;
            border-bottom-left-radius: 4px !important;
            margin-bottom: 1rem !important;
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Audio Player Styling */
        .custom-audio {
            filter: invert(1) hue-rotate(180deg);
            opacity: 0.9;
            height: 40px;
            width: 100%;
            border-radius: 8px;
            outline: none;
        }
    </style>
</head>
<body class="flex flex-col relative">

    <div id="public-view" class="hidden"></div>

    <div class="immersive-bg" id="global-bg-layer"></div>
    <div class="bg-overlay"></div>

    <nav class="shrink-0 h-16 w-full z-50 px-6 flex justify-between items-center bg-slate-900/50 backdrop-blur-md border-b border-white/10">
        <a href="index.html" class="flex items-center gap-3 text-white hover:text-white/70 transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5 theme-text"></i>
            <span class="font-space font-bold tracking-widest text-sm uppercase">Back</span>
        </a>
        <div class="text-[9px] md:text-[10px] font-space font-bold tracking-widest text-white/50 uppercase">
            Messenger
        </div>
    </nav>

    <main class="flex-1 w-full max-w-4xl mx-auto p-4 md:p-6 flex flex-col overflow-hidden relative z-10">
        
        <div class="glass-panel flex-1 flex flex-col rounded-3xl shadow-2xl overflow-hidden relative border border-white/10">
            
            <div class="shrink-0 p-4 border-b border-white/10 flex justify-between items-center bg-white/5">
                <span class="font-space font-bold text-[10px] tracking-widest uppercase text-white/50">Encrypted Log</span>
                <span class="flex items-center gap-2 theme-text text-[9px] font-bold uppercase tracking-widest">
                    <span class="w-2 h-2 rounded-full theme-bg animate-pulse"></span> Online
                </span>
            </div>
            
            <div id="commsContainer" class="flex-1 overflow-y-auto p-4 custom-scrollbar flex flex-col">
                <div class="text-center py-10 text-white/30 font-space text-sm m-auto">
                    <i data-lucide="loader" class="w-5 h-5 animate-spin mx-auto mb-2 theme-text"></i> Syncing...
                </div>
            </div>

            <div class="shrink-0 p-3 md:p-4 bg-black/40 border-t border-white/10">
                
                <div class="flex justify-between items-end mb-2">
                    <span class="text-[9px] font-bold text-white/50 tracking-widest uppercase">Message Portal</span>
                    <span id="recordStatus" class="text-[9px] font-space font-bold theme-text uppercase tracking-widest"></span>
                </div>
                
                <div id="audioAttachmentArea" class="hidden flex-col gap-2 mb-3 bg-black/60 border border-white/10 rounded-xl p-3 transition-all relative">
                    <button id="deleteAudioBtn" onclick="window.localDeleteAudio()" class="hidden absolute -top-2 -right-2 bg-red-500 text-white border-2 border-slate-900 rounded-full p-1 hover:bg-red-400 transition-colors z-20" title="Delete Audio">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                    <canvas id="audioVisualizer" class="w-full h-10 hidden"></canvas>
                    <audio id="audioPlayback" controls class="custom-audio hidden"></audio>
                </div>

                <div class="flex gap-2 items-end">
                    <div class="w-[30%] md:w-32 shrink-0">
                        <select id="commAuthor" class="w-full bg-white/5 border border-white/20 rounded-xl p-3 md:p-3.5 text-xs font-space font-bold text-white outline-none focus:border-white/50 shadow-inner appearance-none cursor-pointer">
                            <option value="Loading...">Syncing...</option>
                        </select>
                    </div>
                    
                    <div class="flex-1 relative">
                        <textarea id="commMessage" rows="1" class="w-full bg-white/5 border border-white/20 rounded-xl p-3 md:p-3.5 pr-12 text-sm text-white outline-none focus:border-white/50 resize-none custom-scrollbar" placeholder="Message..."></textarea>
                        
                        <button id="recordBtn" onclick="window.localToggleRecord()" class="absolute right-1 bottom-1 w-10 h-10 md:w-11 md:h-11 rounded-lg text-white/50 hover:text-white hover:bg-white/10 transition-colors flex justify-center items-center group" title="Record Voice">
                            <i data-lucide="mic" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                        </button>
                    </div>

                    <button onclick="window.localPostComm()" class="w-12 h-12 md:w-14 md:h-14 shrink-0 theme-bg text-black rounded-xl hover:opacity-90 transition-opacity flex justify-center items-center shadow-lg group">
                        <i data-lucide="send" class="w-5 h-5 ml-1 group-active:scale-90 transition-transform"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="fixed top-20 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module" src="app.js"></script>

    <script type="module">
        import { getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Initialize icons
        if (typeof lucide !== 'undefined') lucide.createIcons();

        // Toast Engine
        function showLocalToast(msg, type) {
            const container = document.getElementById('toastContainer'); 
            if (!container) return;
            const t = document.createElement('div'); 
            t.className = `flex items-center gap-3 px-4 py-3 rounded-xl backdrop-blur-xl border shadow-2xl text-xs font-space font-bold tracking-widest uppercase transition-all transform duration-300 ${type === 'success' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400' : 'bg-red-500/20 border-red-500/50 text-red-400'}`;
            t.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i> <span>${msg}</span>`;
            container.appendChild(t); 
            if (typeof lucide !== 'undefined') lucide.createIcons();
            setTimeout(() => { 
                t.style.opacity = '0'; 
                t.style.transform = 'translateY(-20px)'; 
                setTimeout(() => t.remove(), 300); 
            }, 3000);
        }

        // --- Audio Globals ---
        let localMediaRecorder;
        let localAudioChunks = [];
        let localAudioBase64 = null;
        let audioCtx, analyser, dataArray, animationId;

        window.localDeleteAudio = () => {
            localAudioBase64 = null;
            localAudioChunks = [];
            document.getElementById('audioPlayback').src = "";
            document.getElementById('audioAttachmentArea').classList.add('hidden');
            document.getElementById('recordStatus').innerText = "";
            
            const btn = document.getElementById('recordBtn');
            btn.innerHTML = `<i data-lucide="mic" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>`;
            btn.classList.remove('text-red-400', 'bg-red-500/20');
            btn.classList.add('text-white/50');
            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        window.localToggleRecord = async () => {
            const btn = document.getElementById('recordBtn');
            const attachmentArea = document.getElementById('audioAttachmentArea');
            const status = document.getElementById('recordStatus');
            const visualizer = document.getElementById('audioVisualizer');
            const playback = document.getElementById('audioPlayback');
            const deleteBtn = document.getElementById('deleteAudioBtn');

            if (localAudioBase64 && (!localMediaRecorder || localMediaRecorder.state !== 'recording')) {
                showLocalToast('Delete current audio to record again', 'error');
                return;
            }

            // Stop
            if (localMediaRecorder && localMediaRecorder.state === 'recording') {
                localMediaRecorder.stop();
                btn.innerHTML = `<i data-lucide="mic" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>`;
                btn.classList.remove('text-red-400', 'bg-red-500/20');
                btn.classList.add('text-white/50');
                
                cancelAnimationFrame(animationId);
                const canvasCtx = visualizer.getContext('2d');
                canvasCtx.clearRect(0, 0, visualizer.width, visualizer.height);
                
                visualizer.classList.add('hidden');
                playback.classList.remove('hidden');
                deleteBtn.classList.remove('hidden');
                status.innerText = "Audio Attached";
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            // Start
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localMediaRecorder = new MediaRecorder(stream);
                localAudioChunks = [];

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                source.connect(analyser);
                analyser.fftSize = 64; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                attachmentArea.classList.remove('hidden');
                visualizer.classList.remove('hidden');
                playback.classList.add('hidden');
                deleteBtn.classList.add('hidden');
                
                const canvasCtx = visualizer.getContext('2d');
                const drawWave = () => {
                    animationId = requestAnimationFrame(drawWave);
                    analyser.getByteFrequencyData(dataArray);
                    canvasCtx.clearRect(0, 0, visualizer.width, visualizer.height);
                    
                    const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-hex').trim() || '#38bdf8';
                    canvasCtx.fillStyle = themeColor;
                    
                    const barWidth = 6;
                    let x = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        let barHeight = dataArray[i] / 4; 
                        canvasCtx.fillRect(x, (visualizer.height - barHeight) / 2, barWidth - 2, barHeight);
                        x += barWidth;
                    }
                };
                drawWave();

                localMediaRecorder.ondataavailable = e => localAudioChunks.push(e.data);
                localMediaRecorder.onstop = () => {
                    const blob = new Blob(localAudioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(blob);
                    playback.src = audioUrl;
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => { localAudioBase64 = reader.result; };
                    stream.getTracks().forEach(t => t.stop());
                };

                localMediaRecorder.start();
                status.innerText = "Recording...";
                btn.innerHTML = `<i data-lucide="square" class="w-4 h-4 text-red-400 fill-current animate-pulse"></i>`;
                btn.classList.remove('text-white/50');
                btn.classList.add('bg-red-500/20');
                if (typeof lucide !== 'undefined') lucide.createIcons();

                setTimeout(() => {
                    if (localMediaRecorder.state === 'recording') window.localToggleRecord();
                }, 15000);

            } catch (err) {
                showLocalToast('Microphone access denied', 'error');
            }
        };

        // --- DISPATCH MESSAGE ---
        window.localPostComm = async () => {
            const author = document.getElementById('commAuthor').value;
            const msgElement = document.getElementById('commMessage');
            const msg = msgElement.value.trim();

            if (!msg && !localAudioBase64) {
                return showLocalToast('Enter text or record audio', 'error');
            }

            try {
                // Lazily get DB to avoid race conditions with app.js
                const app = getApp();
                const db = getFirestore(app);

                await setDoc(doc(db, "artifacts/aircross-odyssey-main/public/data/comms", Date.now().toString()), {
                    id: Date.now().toString(),
                    author: author,
                    message: msg,
                    audio: localAudioBase64 || null,
                    timestamp: Date.now()
                });

                msgElement.value = '';
                window.localDeleteAudio(); 
                showLocalToast('Message Sent', 'success');

                setTimeout(() => {
                    const container = document.getElementById('commsContainer');
                    if (container) container.scrollTop = container.scrollHeight;
                }, 500);

            } catch (e) {
                showLocalToast('Failed to send', 'error');
            }
        };
    </script>
</body>
</html>
