<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOYAGER | Messenger</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { --theme-hex: #38bdf8; --theme-rgb: 56, 189, 248; }
        body { background-color: #0f172a; color: #ffffff; font-family: 'Inter', sans-serif; min-height: 100vh; }

        .immersive-bg {
            position: fixed; inset: 0; z-index: -10;
            background-size: cover; background-position: center; background-attachment: fixed;
            background-color: #0f172a;
            transition: background-image 0.5s ease-in-out;
        }
        
        .bg-overlay {
            position: fixed; inset: 0; z-index: -9;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.7) 0%, rgba(15, 23, 42, 0.95) 100%);
        }

        .theme-text { color: var(--theme-hex) !important; }
        .theme-bg { background-color: var(--theme-hex) !important; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .comms-scrollbar::-webkit-scrollbar { width: 4px; }
        .comms-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="pb-20">

    <div class="immersive-bg" id="global-bg-layer"></div>
    <div class="bg-overlay"></div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 px-6 py-4 flex items-center bg-slate-900/50 backdrop-blur-md border-b border-white/10">
        <a href="index.html" class="flex items-center gap-3 text-white hover:opacity-70 transition-opacity">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            <span class="font-space font-bold tracking-widest text-sm uppercase">Back</span>
        </a>
    </nav>

    <!-- Chat Interface -->
    <div class="max-w-3xl mx-auto pt-24 px-4 relative z-10">
        <div class="glass-panel rounded-[2rem] h-[75vh] flex flex-col shadow-2xl overflow-hidden border border-white/10">
            <!-- Header -->
            <div class="p-4 border-b border-white/10 flex justify-between items-center bg-white/5">
                <span class="font-space font-bold text-[10px] tracking-widest uppercase text-white/50">Messages</span>
                <span class="flex items-center gap-2 theme-text text-[9px] font-bold uppercase tracking-widest">
                    <span class="w-2 h-2 rounded-full theme-bg animate-pulse"></span> Active
                </span>
            </div>
            
            <!-- Messages Area -->
            <div id="commsContainer" class="flex-1 overflow-y-auto p-4 comms-scrollbar space-y-4">
                <div class="text-center py-10 text-white/30 font-space text-sm">Syncing logs...</div>
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-white/5 border-t border-white/10">
                <div class="flex gap-3 items-end">
                    <div class="w-24">
                        <label class="text-[9px] font-bold text-white/50 tracking-widest mb-1 block uppercase">Name</label>
                        <select id="commAuthor" class="w-full bg-black/40 border border-white/20 rounded-xl p-3 text-xs font-space font-bold text-white outline-none focus:border-white/50">
                            <option value="Loading...">Syncing...</option>
                        </select>
                    </div>
                    <div class="flex-1 flex gap-2">
                        <textarea id="commMessage" rows="1" class="flex-1 bg-black/40 border border-white/20 rounded-xl p-3 text-sm text-white outline-none focus:border-white/50 resize-none" placeholder="Type a message..."></textarea>
                        <button id="recordBtn" onclick="window.toggleRecord()" class="w-12 h-12 shrink-0 bg-black/40 border border-white/20 rounded-xl text-white/50 hover:text-white transition-colors" title="Record Voice">
                            <i data-lucide="mic" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <button onclick="window.postComm()" class="w-12 h-12 shrink-0 theme-bg text-black rounded-xl hover:opacity-90 transition-opacity flex justify-center items-center">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <!-- Dynamic Theme Init -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        const app = initializeApp({
            apiKey: "AIzaSyA9FiNMZI50q6AeTS0Fiw1Qs-VVMmVI4Os",
            authDomain: "aircross-odyssey-f6e2f.firebaseapp.com",
            projectId: "aircross-odyssey-f6e2f",
            storageBucket: "aircross-odyssey-f6e2f.firebasestorage.app",
            messagingSenderId: "641282553954",
            appId: "1:641282553954:web:4b3fa456d9eda8adf2393b"
        });
        const db = getFirestore(app);
        async function applyTheme() {
            const snap = await getDoc(doc(db, 'artifacts/aircross-odyssey-main/public/data/trip_meta/latest'));
            if (snap.exists()) {
                const data = snap.data();
                if (data.themeColor) document.documentElement.style.setProperty('--theme-hex', data.themeColor);
                if (data.bgImage) document.getElementById('global-bg-layer').style.backgroundImage = `url('${data.bgImage}')`;
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }
        applyTheme();
    </script>
</body>
</html>
