<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOYAGER | Messenger</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { 
            /* Default fallback colors. These are instantly overwritten by the script below to match your theme. */
            --theme-hex: #38bdf8; 
            --theme-rgb: 56, 189, 248; 
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #0f172a; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
        }

        /* Dynamic Background mapped to your index page */
        .immersive-bg {
            position: fixed; inset: 0; z-index: -10;
            background-size: cover; background-position: center; background-attachment: fixed;
            background-color: #0f172a;
            transition: background-image 0.5s ease-in-out;
        }
        
        .bg-overlay {
            position: fixed; inset: 0; z-index: -9;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.7) 0%, rgba(15, 23, 42, 0.95) 100%);
        }

        /* Theme Application Classes */
        .theme-text { color: var(--theme-hex) !important; }
        .theme-bg { background-color: var(--theme-hex) !important; }
        .theme-border { border-color: var(--theme-hex) !important; }

        /* Main UI Container */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* WhatsApp-Style Chat Bubbles (Overriding app.js standard output) */
        #commsContainer > div {
            border: none !important;
            box-shadow: none !important;
            padding: 12px 16px !important;
            border-radius: 1.25rem !important;
            max-width: 85% !important;
            background: rgba(255, 255, 255, 0.08) !important;
            border-bottom-left-radius: 4px !important;
            margin-bottom: 1rem !important;
        }
        
        /* Custom Scrollbar for Chat Feed */
        .comms-scrollbar::-webkit-scrollbar { width: 4px; }
        .comms-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-12">

    <div class="immersive-bg" id="global-bg-layer"></div>
    <div class="bg-overlay"></div>

    <nav class="fixed top-0 w-full z-50 px-6 py-4 flex items-center bg-slate-900/50 backdrop-blur-md border-b border-white/10">
        <a href="index.html" class="flex items-center gap-3 text-white hover:text-white/70 transition-colors">
            <i data-lucide="arrow-left" class="w-5 h-5 theme-text"></i>
            <span class="font-space font-bold tracking-widest text-sm uppercase">Back</span>
        </a>
    </nav>

    <div class="flex-1 w-full max-w-4xl mx-auto pt-24 px-4 flex flex-col relative z-10">
        
        <div class="text-center mb-6 shrink-0">
            <h1 class="text-3xl md:text-5xl font-black font-space uppercase text-white tracking-tighter">Chat</h1>
        </div>

        <div class="glass-panel h-[70vh] md:h-[75vh] rounded-[2rem] flex flex-col shadow-2xl overflow-hidden border border-white/10 relative">
            
            <div class="p-4 border-b border-white/10 flex justify-between items-center bg-white/5 shrink-0">
                <span class="font-space font-bold text-[10px] tracking-widest uppercase text-white/50">Messages</span>
                <span class="flex items-center gap-2 theme-text text-[9px] font-bold uppercase tracking-widest">
                    <span class="w-2 h-2 rounded-full theme-bg animate-pulse"></span> Active
                </span>
            </div>
            
            <div id="commsContainer" class="flex-1 overflow-y-auto p-4 comms-scrollbar flex flex-col">
                <div class="text-center py-10 text-white/30 font-space text-sm m-auto">
                    <i data-lucide="loader" class="w-5 h-5 animate-spin mx-auto mb-2 theme-text"></i> Syncing encrypted logs...
                </div>
            </div>

            <div class="p-3 md:p-4 bg-black/20 border-t border-white/10 shrink-0">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-[9px] font-bold text-white/50 tracking-widest uppercase">Message Portal</span>
                    <span id="recordStatus" class="text-[9px] font-space font-bold theme-text uppercase"></span>
                </div>
                
                <canvas id="audioVisualizer" class="w-full h-10 bg-black/40 rounded-xl mb-3 border border-white/10 hidden"></canvas>

                <div class="flex gap-2 md:gap-3 items-end">
                    <div class="w-[30%] md:w-32 shrink-0">
                        <select id="commAuthor" class="w-full bg-slate-800/80 border border-white/20 rounded-xl p-3 md:p-3.5 text-xs font-space font-bold text-white outline-none focus:border-white/50 shadow-inner appearance-none cursor-pointer">
                            <option value="Loading...">Syncing...</option>
                        </select>
                    </div>
                    
                    <div class="flex-1 relative">
                        <textarea id="commMessage" rows="1" class="w-full bg-black/40 border border-white/20 rounded-xl p-3 md:p-3.5 pr-12 text-sm text-white outline-none focus:border-white/50 resize-none custom-scrollbar" placeholder="Type a message..."></textarea>
                        
                        <button id="recordBtn" onclick="window.localToggleRecord()" class="absolute right-1 bottom-1 w-10 h-10 md:w-11 md:h-11 rounded-lg text-white/50 hover:text-white transition-colors flex justify-center items-center group" title="Record Voice">
                            <i data-lucide="mic" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                        </button>
                    </div>

                    <button onclick="window.localPostComm()" class="w-12 h-12 md:w-14 md:h-14 shrink-0 theme-bg text-black rounded-xl hover:opacity-90 transition-opacity flex justify-center items-center shadow-lg">
                        <i data-lucide="send" class="w-5 h-5 ml-1"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module" src="app.js"></script>

    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Re-connect to Firebase to handle logic independently of app.js
        const firebaseConfig = {
            apiKey: "AIzaSyA9FiNMZI50q6AeTS0Fiw1Qs-VVMmVI4Os",
            authDomain: "aircross-odyssey-f6e2f.firebaseapp.com",
            projectId: "aircross-odyssey-f6e2f",
            storageBucket: "aircross-odyssey-f6e2f.firebasestorage.app",
            messagingSenderId: "641282553954",
            appId: "1:641282553954:web:4b3fa456d9eda8adf2393b"
        };
        const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
        const db = getFirestore(app);

        // --- THEME SYNC ---
        async function applyTheme() {
            const snap = await getDoc(doc(db, 'artifacts/aircross-odyssey-main/public/data/trip_meta/latest'));
            if (snap.exists()) {
                const data = snap.data();
                if (data.themeColor) {
                    document.documentElement.style.setProperty('--theme-hex', data.themeColor);
                }
                if (data.bgImage) {
                    document.getElementById('global-bg-layer').style.backgroundImage = `url('${data.bgImage}')`;
                }
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }
        applyTheme();

        // --- CUSTOM TOAST NOTIFICATION ---
        function showLocalToast(msg, type) {
            const container = document.getElementById('toastContainer'); 
            if (!container) return;
            const t = document.createElement('div'); 
            t.className = `flex items-center gap-3 px-4 py-3 rounded-xl backdrop-blur-xl border shadow-2xl text-xs font-space font-bold tracking-widest uppercase transition-all transform duration-300 ${type === 'success' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-400' : 'bg-red-500/20 border-red-500/50 text-red-400'}`;
            t.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i> <span>${msg}</span>`;
            container.appendChild(t); 
            if (typeof lucide !== 'undefined') lucide.createIcons();
            setTimeout(() => { 
                t.style.opacity = '0'; 
                t.style.transform = 'translateY(20px)'; 
                setTimeout(() => t.remove(), 300); 
            }, 3000);
        }

        // --- AUDIO RECORDING & VISUALIZER ENGINE ---
        let localMediaRecorder;
        let localAudioChunks = [];
        let localAudioBase64 = null;
        let audioCtx, analyser, dataArray, animationId;

        window.localToggleRecord = async () => {
            const btn = document.getElementById('recordBtn');
            const status = document.getElementById('recordStatus');
            const canvas = document.getElementById('audioVisualizer');
            const canvasCtx = canvas.getContext('2d');

            // STOP RECORDING
            if (localMediaRecorder && localMediaRecorder.state === 'recording') {
                localMediaRecorder.stop();
                btn.innerHTML = `<i data-lucide="mic" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>`;
                btn.classList.remove('text-red-400', 'bg-red-500/20');
                btn.classList.add('text-white/50');
                status.innerText = "Audio Attached";
                cancelAnimationFrame(animationId);
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            // START RECORDING
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                localMediaRecorder = new MediaRecorder(stream);
                localAudioChunks = [];

                // Initialize Web Audio API for the visualizer
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                source.connect(analyser);
                analyser.fftSize = 64; // Creates thick, bold bars
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                canvas.classList.remove('hidden');
                
                const drawWave = () => {
                    animationId = requestAnimationFrame(drawWave);
                    analyser.getByteFrequencyData(dataArray);
                    canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Fetch dynamic theme color for the wave
                    const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-hex').trim() || '#38bdf8';
                    canvasCtx.fillStyle = themeColor;
                    
                    const barWidth = 6;
                    let x = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        let barHeight = dataArray[i] / 4; // Scale down height
                        // Center the bars vertically
                        canvasCtx.fillRect(x, (canvas.height - barHeight) / 2, barWidth - 2, barHeight);
                        x += barWidth;
                    }
                };
                drawWave();

                localMediaRecorder.ondataavailable = e => localAudioChunks.push(e.data);
                localMediaRecorder.onstop = () => {
                    const blob = new Blob(localAudioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => { localAudioBase64 = reader.result; };
                    stream.getTracks().forEach(t => t.stop());
                };

                localMediaRecorder.start();
                status.innerText = "Recording...";
                btn.innerHTML = `<i data-lucide="square" class="w-4 h-4 text-red-400 fill-current animate-pulse"></i>`;
                btn.classList.remove('text-white/50');
                btn.classList.add('bg-red-500/20');
                if (typeof lucide !== 'undefined') lucide.createIcons();

                // Auto-stop after 15 seconds
                setTimeout(() => {
                    if (localMediaRecorder.state === 'recording') window.localToggleRecord();
                }, 15000);

            } catch (err) {
                showLocalToast('Microphone access denied', 'error');
            }
        };

        // --- DISPATCH MESSAGE LOGIC ---
        window.localPostComm = async () => {
            const author = document.getElementById('commAuthor').value;
            const msgElement = document.getElementById('commMessage');
            const msg = msgElement.value.trim();

            if (!msg && !localAudioBase64) {
                return showLocalToast('Enter text or record audio', 'error');
            }

            try {
                await setDoc(doc(db, "artifacts/aircross-odyssey-main/public/data/comms", Date.now().toString()), {
                    id: Date.now().toString(),
                    author: author,
                    message: msg,
                    audio: localAudioBase64 || null,
                    timestamp: Date.now()
                });

                // Reset Interface
                msgElement.value = '';
                localAudioBase64 = null;
                document.getElementById('recordStatus').innerText = '';
                document.getElementById('audioVisualizer').classList.add('hidden');
                showLocalToast('Message Sent', 'success');

                // Auto-scroll to bottom of chat
                setTimeout(() => {
                    const container = document.getElementById('commsContainer');
                    if (container) container.scrollTop = container.scrollHeight;
                }, 500);

            } catch (e) {
                showLocalToast('Failed to send', 'error');
            }
        };
    </script>
</body>
</html>
