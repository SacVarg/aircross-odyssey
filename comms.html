<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOYAGER | Messenger</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --theme-hex: #38bdf8;
            --theme-rgb: 56, 189, 248;
        }

        body { 
            background-color: #0f172a; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .immersive-bg {
            position: fixed; inset: 0; z-index: -10;
            background-size: cover; background-position: center; background-attachment: fixed;
            background-color: #0f172a;
            transition: background-image 0.5s ease-in-out;
        }
        
        .bg-overlay {
            position: fixed; inset: 0; z-index: -9;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.7) 0%, rgba(15, 23, 42, 0.95) 100%);
        }

        .theme-text { color: var(--theme-hex) !important; }
        .theme-bg { background-color: var(--theme-hex) !important; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .msg-bubble { max-width: 85%; padding: 12px 16px; border-radius: 1.25rem; font-size: 0.9rem; }
        .msg-received { background: rgba(255,255,255,0.08); border-bottom-left-radius: 0; }
        .msg-sent { background: var(--theme-hex); color: #000; border-bottom-right-radius: 0; margin-left: auto; }

        .comms-scrollbar::-webkit-scrollbar { width: 4px; }
        .comms-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="pb-20">

    <div class="immersive-bg" id="global-bg-layer"></div>
    <div class="bg-overlay"></div>

    <nav class="fixed top-0 w-full z-50 px-6 py-4 flex items-center bg-slate-900/50 backdrop-blur-md border-b border-white/10">
        <a href="index.html" class="flex items-center gap-3 text-white hover:opacity-70 transition-opacity">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
            <span class="font-space font-bold tracking-widest text-sm uppercase">Messenger</span>
        </a>
    </nav>

    <div class="max-w-3xl mx-auto pt-24 px-4 relative z-10">
        <div class="glass-panel rounded-[2rem] h-[75vh] flex flex-col shadow-2xl overflow-hidden border border-white/10">
            <div class="p-4 border-b border-white/10 flex justify-between items-center bg-white/5">
                <span class="font-space font-bold text-[10px] tracking-widest uppercase text-white/50">Secure Channel</span>
                <span class="flex items-center gap-2 theme-text text-[9px] font-bold uppercase tracking-widest">
                    <span class="w-2 h-2 rounded-full theme-bg animate-pulse"></span> Active
                </span>
            </div>
            
            <div id="commsContainer" class="flex-1 overflow-y-auto p-4 comms-scrollbar space-y-4">
                <div class="text-center py-10 text-white/30 font-space text-sm">
                    <i data-lucide="loader" class="w-5 h-5 animate-spin mx-auto mb-2 theme-text"></i> Syncing encrypted logs...
                </div>
            </div>

            <div class="p-4 bg-white/5 border-t border-white/10">
                <div id="audioPreview" class="hidden mb-3 bg-black/40 border border-white/10 rounded-xl p-3 flex items-center justify-between">
                    <span class="text-[10px] font-space text-white/60 uppercase">Recording...</span>
                    <span id="recordingDuration" class="text-[10px] theme-text font-bold">0s</span>
                </div>

                <div class="flex gap-3 items-end">
                    <div class="w-24">
                        <label class="text-[9px] font-bold text-white/50 tracking-widest mb-1 block uppercase">Name</label>
                        <select id="commAuthor" class="w-full bg-black/40 border border-white/20 rounded-xl p-3 text-xs font-space font-bold text-white outline-none focus:border-white/50">
                            <option value="Loading...">Name...</option>
                        </select>
                    </div>
                    <div class="flex-1 flex gap-2">
                        <textarea id="commMessage" rows="1" class="flex-1 bg-black/40 border border-white/20 rounded-xl p-3 text-sm text-white outline-none focus:border-white/50 resize-none" placeholder="Type a message..."></textarea>
                        <button id="recordBtn" onclick="window.toggleRecord()" class="w-12 h-12 shrink-0 bg-black/40 border border-white/20 rounded-xl text-white/50 hover:text-white transition-colors" title="Record">
                            <i data-lucide="mic" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <button onclick="window.postComm()" class="w-12 h-12 shrink-0 theme-bg text-black rounded-xl hover:opacity-90 transition-opacity flex justify-center items-center">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
</body>
</html>
